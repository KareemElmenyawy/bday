<title>عيد ميلاد سعيد 🎂</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg1:#ffe3ef;--bg2:#fff3d6;--text:#4a1d3a;--card:#ffffffcc;--accent:#e0457b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1030;--bg2:#101a3a;--text:#ffe9f3;--card:#ffffff18;--accent:#ff7aa8}}
:root[data-theme="dark"]{--bg1:#2a1030;--bg2:#101a3a;--text:#ffe9f3;--card:#ffffff18;--accent:#ff7aa8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:var(--text);background:linear-gradient(160deg,var(--bg1),var(--bg2));text-align:center;overflow-x:hidden}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px;position:relative;z-index:2}
h1{font-size:2rem;margin:8px 0 2px;color:var(--accent)}
.age{font-size:1.2rem;margin:0 0 14px}
.photo{width:150px;height:150px;border-radius:50%;margin:10px auto;border:5px solid var(--accent);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:3.5rem;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
svg{width:230px;max-width:80%;height:auto;cursor:pointer}
.flame{transform-origin:center bottom;animation:fl .5s infinite alternate}
@keyframes fl{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.12) rotate(3deg)}}
.off .flame{display:none}
.hint{font-size:.95rem;opacity:.8}
.msg{background:var(--card);border-radius:18px;padding:16px;margin-top:16px;line-height:1.9;font-size:1.05rem;opacity:0;transform:translateY(14px);transition:.8s}
.show .msg{opacity:1;transform:none}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
</style>

<p class="hint" id="hint">اضغط على التورتة وطفّي الشمعة 🕯️</p>
<div class="msg">
كل سنة وانت طيب يا خويا، وتفضل مرازيني وجايبلنا حوارات كده من وإحنا في ابتدائي لحد ما بقيت بشمهندس قد الدنيا 😂❤️ ربنا يديمك في حياتنا يا صاحبي ونفضل مع بعض ونشوف بعض دايمًا في أحسن حال ❤️
</div>
</main>
<script>
var NAME="mohaaaaaaa";
if(NAME)document.querySelector("h1").textContent="🎉 كل سنة وانت طيب يا "+NAME+" 🎉";
var m=document.getElementById("m"),cv=document.getElementById("c"),x=cv.getContext("2d"),P=[],run=false;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener("resize",size);
function boom(){
 var cols=["#ff5d8f","#ffd54f","#7ec8ff","#9be37d","#c792ea"];
 for(var i=0;i<160;i++)P.push({x:Math.random()*cv.width,y:-10-Math.random()*200,vy:2+Math.random()*3,vx:Math.random()*2-1,r:3+Math.random()*4,c:cols[i%5],a:Math.random()*6});
 if(!run){run=true;loop()}
}
function loop(){
 x.clearRect(0,0,cv.width,cv.height);
 P=P.filter(function(p){return p.y<cv.height+20});
 P.forEach(function(p){p.y+=p.vy;p.x+=p.vx+Math.sin(p.a+=.05);x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*1.6)});
 if(P.length)requestAnimationFrame(loop);else run=false;
}
document.getElementById("cake").addEventListener("click",function(){
 m.classList.add("off","show");
 document.getElementById("hint").textContent="🎉 تمنّى أمنية! 🎉";
 boom();
});
setTimeout(boom,400);
</script>
