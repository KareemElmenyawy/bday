<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Happy New Year</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ice:#cfeaff;--text:#f2f8ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--text);font-family:"Playfair Display",Georgia,serif;text-align:center;overflow-x:hidden}
body{background:linear-gradient(180deg,#040a1c 0%,#0a1f44 45%,#1b4a72 100%) fixed}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:4;box-shadow:inset 0 0 90px 10px rgba(190,230,255,.22)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.aurora{position:fixed;top:0;left:0;right:0;height:50vh;z-index:0;pointer-events:none;filter:blur(34px);opacity:.45;background:radial-gradient(ellipse at 25% 0,#4dffc8,transparent 60%),radial-gradient(ellipse at 80% 8%,#7aa2ff,transparent 55%);animation:au 12s ease-in-out infinite alternate}
@keyframes au{to{opacity:.7;transform:translateX(20px) scaleY(1.15)}}
.moon{position:fixed;top:78px;right:22px;width:44px;height:44px;border-radius:50%;z-index:0;background:radial-gradient(circle at 35% 35%,#fff,#dbe7f6);box-shadow:0 0 40px 10px rgba(200,225,255,.35)}
#ic{position:absolute;top:0;left:0;width:100%;height:58px;z-index:3;pointer-events:none;filter:drop-shadow(0 0 6px rgba(170,220,255,.7))}
main{position:relative;z-index:2;max-width:460px;margin:0 auto;padding:46px 14px 30px}
.glass{padding:22px 12px 20px;border-radius:26px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.3)}
.top{font-size:.72rem;letter-spacing:.5em;color:var(--ice);opacity:.9}
h1{margin:12px 0 0;font-weight:400;font-size:1.75rem;letter-spacing:.28em;line-height:1.5;background:linear-gradient(100deg,#fff,#a9dcff,#fff,#8ecbff,#fff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 8s linear infinite;filter:drop-shadow(0 0 10px rgba(170,220,255,.5))}
@keyframes sh{to{background-position:250% 0}}
.nm{display:flex;align-items:center;justify-content:center;gap:2px;direction:ltr;margin-top:6px}
.nm span{font-size:3.4rem;color:var(--ice);font-weight:400;opacity:.9}
#nm{width:240px;max-width:62%;height:auto;filter:drop-shadow(0 0 8px rgba(255,150,180,.45))}
.photo{width:186px;height:236px;margin:16px auto 6px;border-radius:93px 93px 16px 16px;padding:4px;background:linear-gradient(145deg,#fff,#8fd0ff 40%,#fff 60%,#6ab8f0);box-shadow:0 0 28px rgba(150,210,255,.55)}
.photo>div{width:100%;height:100%;border-radius:90px 90px 12px 12px;background:#0c2038;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:.7rem;letter-spacing:.35em;color:#7fa3c4}
.photo img{width:100%;height:100%;object-fit:cover}
.cd{display:flex;gap:10px;justify-content:center;margin-top:18px;direction:ltr}
.cd div{min-width:62px;padding:8px 6px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08)}
.cd b{display:block;font-weight:400;font-size:1.6rem}
.cd small{font-size:.55rem;letter-spacing:.25em;color:var(--ice);text-transform:uppercase}
svg.land{display:block;width:calc(100% + 28px);margin:22px -14px 0;height:auto}
.hint{margin-top:10px;font-size:.62rem;letter-spacing:.3em;opacity:.55;text-transform:uppercase}

#ov{position:fixed;inset:0;z-index:50;touch-action:none;-webkit-user-select:none;user-select:none}
#paper,#fire{position:absolute;inset:0;width:100%;height:100%}
#fire{pointer-events:none}
#hint{position:absolute;top:30%;left:0;right:0;text-align:center;color:#8d8778;font:600 1.2rem "Playfair Display",Georgia,serif;direction:rtl;pointer-events:none;transition:opacity .5s;line-height:2.1}
#hint small{display:block;font-size:.85rem;opacity:.75}
#candle{position:absolute;width:56px;height:150px;touch-action:none;cursor:grab;z-index:2;filter:drop-shadow(0 0 16px rgba(255,170,60,.65))}
.flm{transform-origin:28px 44px;animation:flk .3s infinite alternate}
@keyframes flk{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.9,1.12) rotate(3deg)}}
</style>
</head>
<body>
<div id="ov"><canvas id="paper"></canvas><canvas id="fire"></canvas>
<div id="hint">في مفاجأة مستخبية 🎁<small>اسحب الشمعة وولّع في الورقة 🔥</small></div>
<div id="candle"><svg viewBox="0 0 56 150" width="56" height="150"><defs><linearGradient id="cg" x1="0" x2="1"><stop offset="0" stop-color="#e6d7b8"/><stop offset=".5" stop-color="#fff8e6"/><stop offset="1" stop-color="#d6c4a0"/></linearGradient><radialGradient id="fg" cx=".5" cy=".75" r=".6"><stop offset="0" stop-color="#fff6c0"/><stop offset=".45" stop-color="#ffb52e"/><stop offset="1" stop-color="#ff6a00" stop-opacity="0"/></radialGradient></defs><g class="flm"><ellipse cx="28" cy="26" rx="11" ry="21" fill="url(#fg)"/><ellipse cx="28" cy="33" rx="4" ry="9" fill="#fffbe0"/></g><line x1="28" y1="44" x2="28" y2="56" stroke="#3a2a1a" stroke-width="2"/><rect x="12" y="54" width="32" height="88" rx="5" fill="url(#cg)"/><path d="M14 56q0 16 5 16t5-16z" fill="#fff8e6"/><ellipse cx="28" cy="142" rx="24" ry="6" fill="#b88a3a"/></svg></div>
</div>

<div class="aurora"></div><div class="moon"></div>
<canvas id="fx"></canvas>
<svg id="ic" viewBox="0 0 440 60" preserveAspectRatio="none"><defs><linearGradient id="ig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#8fd0ff" stop-opacity=".75"/></linearGradient></defs><path id="icp" fill="url(#ig)"/></svg>
<main>
<div class="glass">
<div class="top">· 2 0 2 7 ·</div>

 stars.forEach(function(s){x.globalAlpha=.4+.6*Math.abs(Math.sin(t/900+s.a));x.fillStyle="#fff";x.beginPath();x.arc(s.x*W,s.y*H,s.r,0,7);x.fill()});
 x.fillStyle="#fff";snow.forEach(function(f){f.y+=f.v;f.x+=Math.sin(f.a+=.01)*.6+.15;if(f.y>H){f.y=-5;f.x=Math.random()*W}x.globalAlpha=.4+f.r*.2;x.beginPath();x.arc(f.x%W,f.y,f.r,0,7);x.fill()});
 x.globalAlpha=.85;cr.forEach(function(f){f.y+=f.v;f.rot+=.006;f.x+=Math.sin(f.a+=.008)*.5;if(f.y>H+10){f.y=-12;f.x=Math.random()*W}flake(f)});

requestAnimationFrame(loop);
var cd=document.getElementById("cd");

tick();setInterval(tick,1000);

<script>
(function(){

 pts.forEach(function(p){p.v*=1.005;p.r+=p.v;
  px.globalCompositeOperation="source-atop";px.fillStyle="rgba(150,105,55,.55)";poly(px,p,p.r+15);px.fill();px.fillStyle="rgba(30,18,8,.95)";poly(px,p,p.r+8);px.fill();

 fx.globalCompositeOperation="source-over";fx.clearRect(0,0,W,H);fx.globalCompositeOperation="lighter";

  for(var m=0;m<5;m++){var k=Math.floor(Math.random()*48),a=k/48*6.2832,r=p.r*p.n[k]+Math.random()*6;parts.push({x:p.x+Math.cos(a)*r,y:p.y+Math.sin(a)*r,vx:(Math.random()-.5)*.8,vy:-(.6+Math.random()*1.6),l:1,s:1+Math.random()*2.6})}});

 setTimeout(function(){ov.remove();document.documentElement.style.overflow=document.body.style.overflow=""},750);

})();
</script>
